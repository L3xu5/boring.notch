name: Sync with upstream

# Keeps this fork up to date with TheBoredTeam/boring.notch by merging upstream/main
# on a schedule. The fork's own commits are preserved (README.md is kept via the
# merge=ours driver in .gitattributes). If a merge needs human conflict resolution,
# an issue is opened instead of pushing a broken tree.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync:
    if: github.repository == 'L3xu5/boring.notch'
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream sync deploy key
        env:
          SYNC_SSH_KEY: ${{ secrets.SYNC_SSH_KEY }}
        run: |
          if [[ -z "$SYNC_SSH_KEY" ]]; then
            echo "::error::Set the SYNC_SSH_KEY repository secret to the private SSH key of a write-enabled deploy key installed on this repository. GITHUB_TOKEN cannot push upstream workflow changes or trigger Build latest. See README.md for setup."
            exit 1
          fi

      - name: Checkout fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # This repository's write deploy key can update workflows and its push
          # triggers Build latest without storing a personal access token.
          ssh-key: ${{ secrets.SYNC_SSH_KEY }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Enables the `merge=ours` driver declared in .gitattributes (keeps our README.md).
          git config merge.ours.driver true

      - name: Merge upstream/main
        id: sync
        run: |
          git remote add upstream https://github.com/TheBoredTeam/boring.notch.git
          git fetch --no-tags upstream main
          before="$(git rev-parse HEAD)"
          if git merge --no-edit upstream/main; then
            if [ "$before" = "$(git rev-parse HEAD)" ]; then
              echo "status=uptodate" >> "$GITHUB_OUTPUT"
              echo "Already up to date with upstream."
            else
              echo "status=merged" >> "$GITHUB_OUTPUT"
              echo "Merged upstream/main."
            fi
          else
            conflicted_files="$(git diff --name-only --diff-filter=U)"
            if [[ -z "$conflicted_files" ]]; then
              echo "::error::Upstream merge failed without file conflicts. Inspect the merge log above."
              exit 1
            fi
            {
              echo 'Upstream sync needs a manual merge. Conflicting files:'
              echo '```text'
              printf '%s\n' "$conflicted_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
            echo "Merge conflict — leaving main untouched."
          fi

      - name: Push merged changes
        if: steps.sync.outputs.status == 'merged'
        run: git push origin HEAD:main

      - name: Open an issue on conflict
        if: steps.sync.outputs.status == 'conflict'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = "⚠️ Upstream sync needs a manual merge";
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", per_page: 100,
            });
            if (open.some(i => i.title === title)) {
              core.info("Conflict issue already open — not duplicating.");
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                "The scheduled sync from `TheBoredTeam/boring.notch` hit a merge conflict that needs manual resolution.",
                "",
                "```bash",
                "git remote add upstream https://github.com/TheBoredTeam/boring.notch.git  # once",
                "git config merge.ours.driver true",
                "git switch main",
                "git fetch upstream main",
                "git merge upstream/main   # resolve the conflicts",
                "git push origin main",
                "```",
                "",
                "_This issue won't be reopened while it stays open._",
              ].join("\n"),
            });

      - name: Report unresolved upstream conflicts
        if: always() && steps.sync.outputs.status == 'conflict'
        run: |
          echo "::error::Upstream sync has merge conflicts. Resolve them manually; see the job summary and conflict issue."
          exit 1
