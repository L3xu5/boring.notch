name: Build latest

# SSH deploy-key pushes from sync-upstream trigger this workflow like manual pushes.
# Keep the installed bundle name and rolling ZIP URL compatible with the Homebrew cask.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-latest
  # Never interrupt publication between uploading an archive and its signed appcast.
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.repository == 'L3xu5/boring.notch' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - name: Check signing configuration
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for required in SIGNING_CERT_P12 SIGNING_CERT_PASSWORD SIGNING_IDENTITY SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!required}" ]]; then
              echo "::error::Missing repository secret: $required. See README.md for release setup."
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The commit count is the fork's monotonic build number.

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Compute and stamp version
        id: ver
        run: |
          set -euo pipefail
          BUILD="$(git rev-list --count HEAD)"
          BASE_VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('boringNotch.xcodeproj/project.pbxproj').read_text()
          versions = set(re.findall(r'MARKETING_VERSION = "?([^";]+)"?;', text))
          if len(versions) != 1:
              raise SystemExit('Expected one marketing version across app and helper configurations')
          print(versions.pop())
          PY
          )"
          SHORT="${BASE_VERSION}-yandex.${BUILD}"
          python3 .github/scripts/stamp_version.py \
            --pbxproj boringNotch.xcodeproj/project.pbxproj \
            --version "$SHORT" --build-number "$BUILD"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "archive=boringNotch-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          set -euo pipefail
          xcodebuild \
            -project boringNotch.xcodeproj \
            -scheme boringNotch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            -disableAutomaticPackageResolution \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            build

      - name: Stage app with the compatible bundle name
        run: |
          # Upstream names its product "Boring Notch.app". Keep boringNotch.app for
          # existing installations and the Homebrew cask without renaming the XPC helper.
          mkdir -p dist
          ditto "build/Build/Products/Release/Boring Notch.app" "dist/boringNotch.app"

      - name: Codesign with stable self-signed identity
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          CERT_PW: ${{ secrets.SIGNING_CERT_PASSWORD }}
          IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="dist/boringNotch.app"
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KCPW="$(openssl rand -hex 12)"
          cleanup() {
            rm -f "$RUNNER_TEMP/cert.p12"
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PW" -T /usr/bin/codesign -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KEYCHAIN" >/dev/null
          # The runner is disposable; keep its login keychain in the search list too.
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          # Omit App Sandbox so Accessibility control works. Preserve this identity
          # between builds so macOS Accessibility grants survive Sparkle updates.
          codesign --force --deep --timestamp=none -s "$IDENTITY" --keychain "$KEYCHAIN" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Package app
        run: ditto -c -k --keepParent "dist/boringNotch.app" boringNotch.zip

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          ARCHIVE: ${{ steps.ver.outputs.archive }}
        run: |
          set -euo pipefail
          SIGN="build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
          test -x "$SIGN"
          KEY_FILE="$RUNNER_TEMP/sparkle-key"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"
          SIGINFO="$("$SIGN" boringNotch.zip -f "$KEY_FILE")"
          cp boringNotch.zip "$ARCHIVE"
          # Each appcast points at an immutable archive. Older feeds remain valid
          # while the compatible rolling ZIP and the new feed are being uploaded.
          python3 .github/scripts/create_fork_appcast.py \
            --app dist/boringNotch.app --archive "$ARCHIVE" \
            --download-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/${ARCHIVE}" \
            --signature "$SIGINFO" --output appcast.xml

      - name: Publish rolling and versioned releases
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.ver.outputs.archive }}
          BUILD: ${{ steps.ver.outputs.build }}
          SHORT: ${{ steps.ver.outputs.short }}
        run: |
          set -euo pipefail
          # A queued/manual run must never replace a newer main build.
          CURRENT_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$CURRENT_HEAD" != "$GITHUB_SHA" ]]; then
            echo "Skipping publication: main advanced beyond ${GITHUB_SHA}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          VERSION_TAG="v${SHORT}"
          VERSION_TITLE="Boring Notch — Yandex Music ${SHORT}"
          VERSION_DRAFT=missing
          if VERSION_DRAFT="$(gh release view "$VERSION_TAG" --json isDraft --jq '.isDraft' 2>"$RUNNER_TEMP/version-release-error")"; then
            if [[ "$VERSION_DRAFT" != true && "$VERSION_DRAFT" != false ]]; then
              echo "::error::Could not determine whether ${VERSION_TAG} is a draft."
              exit 1
            fi
          elif grep -Eq 'release not found|HTTP 404' "$RUNNER_TEMP/version-release-error"; then
            VERSION_DRAFT=missing
          else
            cat "$RUNNER_TEMP/version-release-error" >&2
            exit 1
          fi
          # Versioned releases are permanent: a rerun may reuse only this commit's tag.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION_TAG}" > /dev/null 2>"$RUNNER_TEMP/version-tag-error"; then
            # The commits endpoint also resolves annotated tags to their commit.
            VERSION_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION_TAG}" --jq '.sha')"
            if [[ "$VERSION_SHA" != "$GITHUB_SHA" ]]; then
              echo "::error::${VERSION_TAG} points to ${VERSION_SHA}, expected ${GITHUB_SHA}; refusing to replace it."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/version-tag-error"; then
            cat "$RUNNER_TEMP/version-tag-error" >&2
            exit 1
          elif [[ "$VERSION_DRAFT" == false ]]; then
            echo "::error::Published release ${VERSION_TAG} is missing its tag. Restore it before rerunning."
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Auto-built from \`main\` (${GITHUB_SHA::7}), version ${SHORT}, build ${BUILD}.

          The app self-updates via Sparkle (Settings → Check for Updates).
          Homebrew: \`brew install --cask l3xu5/boring-notch/boring-notch-yandex\`.
          EOF
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --draft --title "Rolling build ${SHORT}" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"
          fi
          gh release upload latest "$ARCHIVE"
          gh release upload latest boringNotch.zip --clobber
          # Publish the feed last; its archive already exists and is never overwritten
          # by another build, including reruns. Keep old archives for older feeds.
          gh release upload latest appcast.xml --clobber
          # A new draft release may not create its tag until publication.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/tags/latest -f sha="$GITHUB_SHA" >/dev/null
          fi
          gh release edit latest --draft=false --latest=false --title "Rolling build ${SHORT}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          if [[ "$VERSION_DRAFT" == false ]]; then
            echo "Kept published release ${VERSION_TAG}; its assets and notes are unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ "$VERSION_DRAFT" == missing ]]; then
              gh release create "$VERSION_TAG" --draft --title "$VERSION_TITLE" \
                --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"
            fi
            gh release upload "$VERSION_TAG" boringNotch.zip appcast.xml --clobber
            # Publish last so the new release is visible only with both assets ready.
            gh release edit "$VERSION_TAG" --draft=false --latest --title "$VERSION_TITLE" \
              --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA"
          fi
          echo "Published rolling build ${SHORT} (${GITHUB_SHA}) and release ${VERSION_TAG}." >> "$GITHUB_STEP_SUMMARY"
