name: Validate fork

on:
  push:
    branches: [main]
    paths: ['.github/**', 'boringNotch/**', 'BoringNotchXPCHelper/**', 'Packages/**', 'Tests/**', 'boringNotch.xcodeproj/**', 'Configuration/**']
  pull_request:
    branches: [main]
    paths: ['.github/**', 'boringNotch/**', 'BoringNotchXPCHelper/**', 'Packages/**', 'Tests/**', 'boringNotch.xcodeproj/**', 'Configuration/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release scripts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/check_project.py --python-only

  app-helpers:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Test Swift 6 Core and native integration boundaries
        run: python3 .github/scripts/check_project.py --native-only
      - name: Compile the application in Debug
        run: |
          xcodebuild -project boringNotch.xcodeproj -scheme boringNotch \
            -configuration Debug -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/boring-debug" \
            -disableAutomaticPackageResolution ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
