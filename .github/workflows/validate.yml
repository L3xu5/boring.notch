name: Validate fork

on:
  push:
    branches: [main]
    paths: ['.github/**', 'boringNotch/**', 'Tests/**']
  pull_request:
    branches: [main]
    paths: ['.github/**', 'boringNotch/**', 'Tests/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release scripts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s .github/scripts/tests -v

  app-helpers:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'
      - name: Test Yandex authentication and token migration
        run: python3 .github/scripts/run_yandex_auth_tests.py
      - name: Test lyrics selection and request cancellation
        run: python3 .github/scripts/test_lyrics.py
      - name: Test track metadata and artwork transitions
        run: python3 .github/scripts/test_music_metadata.py
      - name: Test fragmented MediaRemote stream decoding
        run: python3 .github/scripts/test_media_stream.py
      - name: Test hardware media key routing
        run: python3 .github/scripts/test_media_keys.py
      - name: Test conservative native media-key recovery
        run: python3 .github/scripts/test_media_key_recovery.py
      - name: Test Yandex metadata stream and fallback parsing
        run: python3 .github/scripts/test_yandex_metadata.py
